# http {} 中的 server 示例。HTTPS 证书由部署环境提供。
server {
    listen 80;
    server_name lod-origin.example.net;

    location /lod/v1/ {
        proxy_pass http://127.0.0.1:25590;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
