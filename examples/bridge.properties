# 放到 Velocity 的 plugins/vss-cdn-bridge/bridge.properties。
# 先从两个后端各自生成的配置中复制 ID 与密钥，再改 enabled=true。
enabled=false
cdn.baseUrl=https://lod.example.net
# Velocity 看到的玩家来源为 192.168.0.0/16 时，通知客户端走原生 VSS。
lan.direct.enabled=true
http.bind=127.0.0.1
http.port=25590
http.concurrency=32
backend.names=main,survival

backend.main.id=11111111-1111-1111-1111-111111111111
backend.main.host=127.0.0.1
backend.main.port=25591
backend.main.secret=COPY_THE_SECRET_FROM_MAIN_SERVER_CONFIG
backend.main.connections=4

backend.survival.id=22222222-2222-2222-2222-222222222222
backend.survival.host=127.0.0.1
backend.survival.port=25592
backend.survival.secret=COPY_THE_SECRET_FROM_SURVIVAL_SERVER_CONFIG
backend.survival.connections=4
